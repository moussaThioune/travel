
server.port=${PORT:8080}
spring.application.name=travel-agency

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# ===========================================================
# JWT
# ===========================================================
app.jwt.secret=VoyageurSecretKeyTresLongueEtSecurisee2024PourJWTAuthentification
app.jwt.expiration=86400000

# ===========================================================
# MAIL — Brevo API (HTTP, pas SMTP — compatible Railway)
# 1. Créer un compte gratuit sur brevo.com
# 2. Paramètres → Clés API → Créer une clé
# 3. Ajouter BREVO_API_KEY comme variable d'env sur Railway
# ===========================================================
app.brevo.api-key=${BREVO_API_KEY:}
app.mail.from=moussampthioune@gmail.com
app.mail.from-name=Voyageur Travel
# ===========================================================
# FRONTEND URL (pour les liens dans les emails)
# Surcharger via variable d'env FRONTEND_URL en production
# ===========================================================
app.frontend.url=${FRONTEND_URL:https://travelfront-production.up.railway.app}

# ===========================================================
# CORS
# ===========================================================
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201

# ===========================================================
# UPLOAD
# ===========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===========================================================
# LOGS
# ===========================================================
logging.level.com.travelagency=INFO
logging.level.org.springframework.security=WARN

# ===========================================================
# ASSURANCE
# ===========================================================
app.assurance.nom=Agence Assurance Voyageur
app.assurance.tel=+221 78 143 44 44

# SMS (false = simulation/log, true = envoi réel via Twilio)
app.sms.enabled=false
